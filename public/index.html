<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>ClosetCast — Leather Moto Jacket</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --ink:#17181A; --muted:#6B6D72;
    --border:#E7E5E0; --border-soft:#EFEEE9;
    --accent:#8A6A3E; --accent-deep:#6E5330; --accent-soft:rgba(138,106,62,.12);
    --green:#2F6B4F; --green-soft:#EFF4EF;
    --red:#B03A2E; --red-soft:#FBEEEC;
    --r-lg:14px; --r-md:10px; --r-sm:7px;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow-frame:0 1px 2px rgba(23,24,26,.04), 0 18px 44px -22px rgba(23,24,26,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100dvh;}
  body{
    font-family:var(--sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background:#FAFAF8;
  }
  .app-shell{position:relative;min-height:100dvh;display:flex;flex-direction:column;}

  /* ═══════════ TOP BAR ═══════════ */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(250,250,248,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border-soft);
    height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;
  }
  .topbar .tl{justify-self:start;display:flex;align-items:center;}
  .topbar .tc{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .topbar .tr{justify-self:end;}
  .topbar b{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1;}
  .topbar .loc{font-size:8px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);line-height:1;}
  .icon-btn{background:none;border:0;padding:7px;cursor:pointer;display:flex;color:var(--ink);border-radius:var(--r-sm);transition:background .15s,opacity .15s;}
  .icon-btn:hover{background:rgba(23,24,26,.05);} .icon-btn:active{opacity:.5;}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
  .scroll::-webkit-scrollbar{display:none;}

  .wrap{max-width:440px;margin:0 auto;padding:20px 20px 132px;}

  /* ═══════════ SCANNER ═══════════ */
  .scanner-screen{position:relative;width:100%;height:calc(100dvh - 176px);min-height:420px;overflow:hidden;background:#0A0A0C;border-radius:var(--r-lg);}
  .scanner-screen video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none;}
  .scanner-screen video::-webkit-media-controls{display:none !important;}
  .scanner-screen video::-webkit-media-controls-enclosure{display:none !important;}
  .scanner-overlay{position:absolute;inset:0;pointer-events:none;}
  .scanner-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;height:124px;}
  .scanner-frame .c{position:absolute;width:22px;height:22px;border-color:rgba(255,255,255,.9);border-style:solid;border-width:0;}
  .scanner-frame .c.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:5px;}
  .scanner-frame .c.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:5px;}
  .scanner-frame .c.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:5px;}
  .scanner-frame .c.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:5px;}
  .scanner-hint{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:7px;}
  .scanner-screen-err{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:var(--red);color:#fff;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:600;z-index:12;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);}

  .scanner-start-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;background:none;border:0;font-family:var(--sans);padding:0;color:#fff;outline:none;}
  .scanner-start-btn .ring{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;transition:border-color .25s,transform .15s;position:relative;}
  .scanner-start-btn .ring svg{width:32px;height:32px;color:rgba(255,255,255,.85);}
  .scanner-start-btn .ring::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.1);}
  .scanner-start-btn:hover .ring{border-color:rgba(255,255,255,.5);transform:scale(1.04);}
  .scanner-start-btn:active .ring{transform:scale(.96);}
  .scanner-start-btn .label{font-size:14px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.85);}

  .fullscreen-scanner{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;opacity:0;transition:opacity .32s ease;}
  .fullscreen-scanner.open{opacity:1;}
  .fullscreen-scanner video{width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .fullscreen-scanner video::-webkit-media-controls{display:none !important;}
  .fullscreen-scanner video::-webkit-media-controls-enclosure{display:none !important;}
  .fullscreen-scanner video::-webkit-media-controls-panel{display:none !important;}
  .fullscreen-scanner video::-webkit-media-controls-start-playback-button{display:none !important;}
  .fullscreen-scanner video::-webkit-media-controls-play-button{display:none !important;}
  .fullscreen-scanner video::-webkit-media-controls-pause-button{display:none !important;}
  .fullscreen-scanner #qr-shaded-region,.fullscreen-scanner [id="qr-shaded-region"],#qr-shaded-region{display:none !important;visibility:hidden !important;}
  .fullscreen-scanner .scanner-overlay{position:fixed;inset:0;pointer-events:none;z-index:1000;}
  .fullscreen-scanner .scanner-tap{position:fixed;inset:0;z-index:1004;cursor:pointer;}
  .fullscreen-scanner .scanner-frame{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:76%;height:144px;}
  .fullscreen-scanner .scanner-frame .c{position:absolute;width:26px;height:26px;border-color:rgba(255,255,255,.9);border-style:solid;border-width:0;}
  .fullscreen-scanner .scanner-frame .c.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:5px;}
  .fullscreen-scanner .scanner-frame .c.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:5px;}
  .fullscreen-scanner .scanner-frame .c.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:5px;}
  .fullscreen-scanner .scanner-frame .c.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:5px;}
  .fullscreen-scanner .scanner-hint{position:fixed;bottom:44px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;font-weight:500;letter-spacing:.04em;z-index:1002;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:8px;}
  .fullscreen-scanner .scanner-error{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);z-index:1003;display:flex;align-items:center;gap:8px;background:rgba(176,58,46,.9);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:.01em;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:rise .3s var(--ease) both;}
  .fullscreen-scanner .scanner-error svg{width:16px;height:16px;flex:0 0 auto;}
  .fullscreen-scanner .scanner-hint svg{width:14px;height:14px;opacity:.5;}
  .fullscreen-scanner .scanner-demo-hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.32);font-size:11px;font-weight:500;letter-spacing:.03em;z-index:1002;pointer-events:none;}
  .fullscreen-scanner .scanner-header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:1001;padding:0 72px;text-align:center;pointer-events:none;}
  .fullscreen-scanner .scanner-header h1{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;color:#fff;letter-spacing:-.005em;opacity:0;transition:opacity .5s ease;}
  .fullscreen-scanner .scanner-header p{margin:3px 0 0;font-size:12px;color:rgba(255,255,255,.45);opacity:0;transition:opacity .5s ease .1s;}
  .fullscreen-scanner.open .scanner-header h1,.fullscreen-scanner.open .scanner-header p{opacity:1;}

  .fs-open body{overflow:hidden;}
  .fs-open .app-shell{display:none;}

  /* ═══════════ HERO ═══════════ */
  .hero-frame{border-radius:var(--r-lg);overflow:hidden;background:#EEECE6;border:1px solid var(--border);box-shadow:var(--shadow-frame);}
  .hero{position:relative;aspect-ratio:4/5;}
  .hero svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hero-tag{
    position:absolute;top:12px;left:12px;z-index:2;
    background:rgba(255,255,255,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:999px;padding:6px 12px;font-size:10.5px;font-weight:650;letter-spacing:.02em;
    display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(23,24,26,.08);
  }
  .hero-tag i{width:6px;height:6px;border-radius:50%;background:var(--red);font-style:normal;animation:pulse 2s ease infinite;}
  @keyframes pulse{50%{opacity:.3;transform:scale(.85);}}
  .hero-sku{
    position:absolute;top:12px;right:12px;z-index:2;background:rgba(23,24,26,.7);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:999px;padding:6px 12px;font-size:10px;font-weight:600;letter-spacing:.04em;
  }

  /* ═══════════ PRODUCT PANEL ═══════════ */
  .panel{padding:26px 4px 2px;text-align:center;}
  .eyebrow{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
  .name{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.12;margin:0 0 10px;}
  .price{font-size:15px;font-weight:650;margin-bottom:4px;}
  .price .note{color:var(--muted);font-weight:500;}
  .desc{color:var(--muted);font-size:13.5px;line-height:1.65;margin:16px auto 0;max-width:330px;}

  .divider{height:1px;background:var(--border);margin:24px 0;}

  /* ═══════════ TRUST ═══════════ */
  .trust{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
  .trust-item{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:500;}
  .trust-item .ic{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;}

  /* ═══════════ CTA + REVEAL ═══════════ */
  .cta-primary{
    width:100%;background:var(--accent);color:#fff;border:0;border-radius:var(--r-md);
    padding:16px;font-size:15px;font-weight:650;font-family:var(--sans);cursor:pointer;letter-spacing:-.005em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 12px 26px -12px rgba(138,106,62,.6);
    transition:background .15s ease, transform .1s ease, box-shadow .2s ease;
  }
  .cta-primary:hover:not(:disabled){background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(138,106,62,.65);}
  .cta-primary:active:not(:disabled){transform:translateY(0) scale(.99);}
  .cta-primary:disabled{background:#DEDCD5;color:#9C9A93;box-shadow:none;cursor:default;}
  .cta-primary svg{width:16px;height:16px;}

  .phone-reveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s var(--ease), opacity .32s ease;}
  .phone-reveal.open{max-height:320px;opacity:1;}
  .phone-ask{font-family:var(--serif);font-size:17px;font-weight:600;margin:4px 0 5px;text-align:left;letter-spacing:-.01em;}
  .phone-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;text-align:left;line-height:1.55;}
  .phone-field{position:relative;}
  .phone-field>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#A9A69C;pointer-events:none;}
  .phone-field .input{padding-left:40px;}
  .inline-reassure{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin:0 0 14px;text-align:left;}
  .inline-reassure svg{width:13px;height:13px;color:var(--green);flex:0 0 auto;}

  .input{
    width:100%;border:1px solid #D6D3CB;border-radius:var(--r-md);padding:15px 14px;
    font-size:15px;font-family:inherit;margin-bottom:12px;outline:none;background:#fff;color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input::placeholder{color:#B4B1A8;}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .fine{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.55;}
  .err{margin-top:12px;padding:11px 13px;border-radius:var(--r-md);background:var(--red-soft);border:1px solid #F0D2CC;color:var(--red);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;}

  /* ═══════════ EXPRESS CHECKOUT ═══════════ */
  .express-checkout{margin-bottom:24px;}
  .express-checkout .eyebrow{text-align:center;}
  #expressCheckoutElement{min-height:44px;}
  .express-checkout .fine{margin-top:10px;}

  /* ═══════════ CONFIRMATION (rich) ═══════════ */
  .confirm{padding:46px 24px 30px;text-align:center;animation:rise .55s var(--ease) both;}
  .ok{
    width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    box-shadow:0 14px 30px -12px rgba(47,107,79,.65);
  }
  .ok svg path{stroke-dasharray:34;stroke-dashoffset:34;animation:draw .5s .35s ease forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .confirm h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0 0 10px;letter-spacing:-.015em;}
  .confirm .sub{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 24px;}
  .confirm .sub b{color:var(--ink);font-weight:600;}

  .saved-row{
    display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--r-lg);
    padding:13px;text-align:left;margin-bottom:18px;background:var(--surface);
    box-shadow:0 1px 2px rgba(23,24,26,.04);
  }
  .saved-row .thumb{width:52px;height:52px;border-radius:var(--r-md);overflow:hidden;flex:0 0 auto;background:#EEECE6;border:1px solid var(--border);}
  .saved-row .thumb svg{width:100%;height:100%;display:block;}
  .saved-row .s-meta{flex:1;min-width:0;}
  .saved-row .s-name{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .saved-row .s-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .saved-row .s-price{font-family:var(--serif);font-size:17px;font-weight:600;}

  .remind{
    display:inline-flex;align-items:center;gap:8px;border:1px solid #DCE6DC;border-radius:999px;
    padding:9px 16px;font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:22px;background:var(--green-soft);color:var(--green);
  }

  /* ── SMS bubble — green version ── */
  .sms{
    position:relative;background:var(--green-soft);border:1px solid #DCE6DC;
    border-radius:16px 16px 3px 16px;padding:14px 16px;font-size:12.5px;line-height:1.6;
    color:#33402f;text-align:left;max-width:300px;margin:0 auto 24px;
  }
  .sms::after{
    content:"";position:absolute;bottom:-1px;right:-5px;width:12px;height:12px;
    background:var(--green-soft);border-right:1px solid #DCE6DC;border-bottom:1px solid #DCE6DC;
    clip-path:polygon(0 0,100% 100%,0 100%);
  }

  .scanline{animation:scan 2.6s ease-in-out infinite;}
  @keyframes scan{0%,100%{transform:translateY(-3px);opacity:.4;}50%{transform:translateY(3px);opacity:1;}}
  .micro{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5;}

  /* ═══════════ STICKY ═══════════ */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(23,24,26,.05);
  }
  .sticky-inner{max-width:440px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .sticky-thumb{width:40px;height:40px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:#EEECE6;border:1px solid var(--border);}
  .sticky-thumb svg{width:100%;height:100%;display:block;}
  .sticky-text{flex:1;min-width:0;}
  .sticky-name{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sticky-price{font-size:11px;color:var(--muted);margin-top:2px;}
  .sticky-btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-size:12.5px;font-weight:650;font-family:var(--sans);cursor:pointer;flex:0 0 auto;transition:opacity .15s,transform .1s;}
  .sticky-btn:hover{opacity:.88;} .sticky-btn:active{transform:scale(.97);}
  .sticky-btn:disabled{background:#DEDCD5;color:#9C9A93;cursor:default;}

  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .75s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  .rise{animation:rise .6s var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s var(--ease);}
  .reveal.in{opacity:1;transform:none;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
    .reveal{opacity:1;transform:none;}
    .phone-reveal{transition:none;}
    .ok svg path{stroke-dashoffset:0;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .input:focus-visible{outline:none;}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="tl">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="tc"><b>ClosetCast</b><span class="loc">Soho · NYC</span></div>
    <div class="tr"></div>
  </header>
  <div class="scroll" id="scrollEl">
    <div class="wrap" id="app"></div>
  </div>
  <div class="sticky" id="stickyBar"></div>
</div>

  <div class="fullscreen-scanner" id="fullscreenScanner">
  <div class="scanner-header">
    <h1>ClosetCast</h1>
    <p>Point camera at barcode</p>
  </div>
  <div id="fsReader" style="width:100%;height:100%;position:absolute;inset:0;pointer-events:none;"></div>
  <div class="scanner-tap" id="fsTap"></div>
  <div class="scanner-overlay">
    <div class="scanner-frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  </div>
  <p class="scanner-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><rect x="16" y="16" width="5" height="5"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Align barcode with the frame
  </p>
  <p class="scanner-demo-hint">Tap the screen to try a demo scan</p>
  <div class="scanner-error" id="fsError" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="fsErrorMsg"></span>
  </div>
</div>

<script>
const ITEM = {

const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const digitsOf = v => v.replace(/\D/g,"");
function fmtPhone(v){
  const d = digitsOf(v).slice(0,10);
  if(d.length<=3) return d;
  if(d.length<=6) return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}

let scannerActive = false;
let fsQr = null;
const fsOverlay = document.getElementById("fullscreenScanner");
const fsReader = document.getElementById("fsReader");

function showScannerError(msg) {
  const box = document.getElementById("fsError");
  const label = document.getElementById("fsErrorMsg");
  if (!box || !label) return;
  label.textContent = msg;
  box.style.display = "flex";
  clearTimeout(showScannerError._t);
  showScannerError._t = setTimeout(() => { box.style.display = "none"; }, 2600);
}

let lastScan = { code: "", at: 0 };
let scanInFlight = false;

function startScanner(facing) {
  if (!fsQr) {
    const el = document.getElementById("fsReader");
    el.innerHTML = "";
    fsQr = new Html5Qrcode("fsReader");
  }
  return fsQr.start(
    facing,
    {
      fps: 8,
      qrbox: { width: 220, height: 90 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_8,
      ],
    },
    text => onDecode(text),
    () => {}
  );
}

function stopScanner() {
  if (fsQr) {
    fsQr.stop().catch(() => {});
    fsQr.clear();
    fsQr = null;
  }
  if (fsReader) fsReader.innerHTML = "";
}

function openOverlay() {
  document.body.classList.add("fs-open");
  fsOverlay.style.display = "flex";
  requestAnimationFrame(() => fsOverlay.classList.add("open"));
}

function startFullscreenScanner() {
  if (scannerActive) return;
  scannerActive = true;
  scanInFlight = false;
  lastScan = { code: "", at: 0 };
  openOverlay();

  const done = () => {
    state.cameraStarted = true;
    state.error = "";
  };
  const failed = () => {
    stopFullscreenScanner();
    if (state.screen === "scanner") {
      state.error = "Camera not available. Please check permissions.";
      render();
    }
  };

  startScanner({ facingMode: "environment" })
    .then(done)
    .catch(() => startScanner({ facingMode: "user" })
      .then(done)
      .catch(failed));
}

function onDecode(text) {
  const now = Date.now();
  if (scanInFlight) return;
  if (text === lastScan.code && now - lastScan.at < 2000) return;
  lastScan = { code: text, at: now };
  navigator.vibrate?.(50);
  scanInFlight = true;
  handleScan(text).finally(() => { scanInFlight = false; });
}

async function handleScan(code) {
  const item = { ...ITEM, barcode: code };
  stopFullscreenScanner();
  state.scannedItem = item;
  state.screen = "detail";
  state.revealed = true;
  state.error = "";
  render();
}

function stopFullscreenScanner() {
  stopScanner();
  scannerActive = false;
  document.body.classList.remove("fs-open");
  fsOverlay.classList.remove("open");
  fsOverlay.style.display = "none";
  const errBox = document.getElementById("fsError");
  if (errBox) errBox.style.display = "none";
}

function renderSticky(){
  if (state.screen !== "detail") { stickyBar.style.display = "none"; return; }
  const item = currentItem();
  stickyBar.style.display = "block";
  const valid = digitsOf(state.phone).length === 10;
  const disabled = state.submitting || !valid;
  stickyBar.innerHTML = `
    <div class="sticky-inner">
      <div class="sticky-thumb">${jacketArt()}</div>
      <div class="sticky-text">
        <div class="sticky-name">${esc(item.name)}</div>
        <div class="sticky-price">$${esc(item.price)} · Size ${esc(item.size)}</div>
      </div>
      <button class="sticky-btn" id="stickyBtn" ${disabled?"disabled":""} aria-label="Save item">Save</button>
    </div>`;
  document.getElementById("stickyBtn").onclick = handleSave;
}

function render(){
  if (state.screen !== "scanner") stopFullscreenScanner();
  if (state.screen === "scanner") {
    app.innerHTML = scannerView();
    stickyBar.style.display = "none";
    setTimeout(() => {
      document.getElementById("startFullscreen")?.addEventListener("click", startFullscreenScanner);
    }, 50);
    if (state.autoStarted) {
      setTimeout(startFullscreenScanner, 120);
    } else {
      state.autoStarted = true;
      setTimeout(() => {
        openOverlay();
        startFullscreenScanner();
      }, 150);
    }
    return;
  }
  app.innerHTML = state.screen === "detail" ? scanView()
    : state.screen === "paid" ? paidView()
    : confirmView();
  if (state.screen === "confirm" || state.screen === "paid") scrollEl.scrollTop = 0;
  if (state.screen === "detail") mountExpressCheckout(currentItem());
  renderSticky();
  bind();
}

function bind(){
  const phoneEl = document.getElementById("phone");
  if (phoneEl) {
    phoneEl.focus();
    const len = phoneEl.value.length;
    phoneEl.setSelectionRange(len, len);
    phoneEl.oninput = e => {
      state.phone = fmtPhone(e.target.value);
      e.target.value = state.phone;
      const valid = digitsOf(state.phone).length === 10;
      const s = document.getElementById("saveBtn");
      if (s) s.disabled = !valid || state.submitting;
      const sb = document.getElementById("stickyBtn");
      if (sb) sb.disabled = state.submitting || !valid;
      if (state.error) state.error = "";
    };
    phoneEl.onkeydown = e => { if (e.key === "Enter") handleSave(); };
  }
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick = handleSave;

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => {
    if (state.screen === "detail") {
      stopFullscreenScanner();
      state.screen = "scanner";
      state.scannedItem = null;
      state.phone = "";
      state.error = "";
      state.revealed = false;
      render();
    }
  };

  const goToScanner = () => {
    stopFullscreenScanner();
    state.screen = "scanner";
    state.scannedItem = null;
    state.paidItem = null;
    state.phone = "";
    state.error = "";
    state.revealed = false;
    state.submitting = false;
    scrollEl.scrollTop = 0;
    render();
  };
  const scanNew = document.getElementById("scanNew");
  if (scanNew) scanNew.onclick = goToScanner;
  const scanNewPaid = document.getElementById("scanNewPaid");
  if (scanNewPaid) scanNewPaid.onclick = goToScanner;

  const ro = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); }
  }), { threshold: 0.1 });
  document.querySelectorAll(".reveal").forEach(el => ro.observe(el));
}

async function handleSave() {
  const digits = state.phone.replace(/\D/g, "");
  if (digits.length !== 10 || state.submitting) return;
  state.submitting = true;
  state.error = "";
  render();

  try {
    const item = state.scannedItem || ITEM;
    const res = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone: digits,
        itemName: item.name,
        size: item.size,
        price: item.price,
        store: item.store,
        sku: item.sku,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      state.screen = "confirm";
    } else {
      state.error = data.error || "Something went wrong.";
    }
  } catch {
    state.error = "Network error. Please try again.";
  }

  state.submitting = false;
  render();
}

let stripeInstance = null;
let stripeConfigPromise = null;

async function getStripeInstance() {
  if (stripeInstance) return stripeInstance;
  if (typeof Stripe === "undefined") return null;
  if (!stripeConfigPromise) {
    stripeConfigPromise = fetch("/api/checkout/config").then(r => r.json()).catch(() => ({}));
  }
  const { publishableKey } = await stripeConfigPromise;
  if (!publishableKey) return null;
  stripeInstance = Stripe(publishableKey);
  return stripeInstance;
}

async function mountExpressCheckout(item) {
  const wrap = document.getElementById("expressCheckoutWrap");
  const mountEl = document.getElementById("expressCheckoutElement");
  if (!wrap || !mountEl) return;

  const stripe = await getStripeInstance();
  if (!stripe) { wrap.style.display = "none"; return; }

  const amount = Math.round(parseFloat(item.price) * 100);
  const elements = stripe.elements({ mode: "payment", currency: "usd", amount });
  const expressCheckoutElement = elements.create("expressCheckout");

  expressCheckoutElement.on("ready", ({ availablePaymentMethods }) => {
    wrap.style.display = availablePaymentMethods ? "block" : "none";
  });

  expressCheckoutElement.on("confirm", async (event) => {
    let clientSecret;
    try {
      const res = await fetch("/api/checkout/intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sku: item.sku }),
      });
      const data = await res.json();
      if (!res.ok || !data.clientSecret) {
        event.paymentFailed({ reason: "fail", message: data.error || "Could not start checkout." });
        return;
      }
      clientSecret = data.clientSecret;
    } catch {
      event.paymentFailed({ reason: "fail", message: "Network error. Please try again." });
      return;
    }

    const result = await stripe.confirmPayment({
      elements,
      clientSecret,
      confirmParams: { return_url: window.location.origin + window.location.pathname },
    });
    if (result.error) {
      event.paymentFailed({ reason: "fail", message: result.error.message });
    }
  });

  expressCheckoutElement.mount(mountEl);
}

async function handleCheckoutRedirectReturn() {
  const params = new URLSearchParams(window.location.search);
  const clientSecret = params.get("payment_intent_client_secret");
  if (!clientSecret) return;

  history.replaceState(null, "", window.location.pathname);

  const stripe = await getStripeInstance();
  if (!stripe) return;

  const { paymentIntent } = await stripe.retrievePaymentIntent(clientSecret);
  if (paymentIntent?.status === "succeeded") {
    state.screen = "paid";
    state.paidItem = state.scannedItem || ITEM;
  }
}

const fsTap = document.getElementById("fsTap");

const demoScan = () => {
  if (scannerActive && state.screen === "scanner") handleScan("0000000000000");
};
fsTap.addEventListener("click", demoScan);
fsTap.addEventListener("touchstart", e => { e.preventDefault(); demoScan(); }, { passive: false });

handleCheckoutRedirectReturn().finally(render);
</script>
</body>
</html>
